name: Mantener la API despierta

# Render's free plan sleeps after 15 idle minutes; a light ping keeps the pilot responsive.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar a /readyz
        run: curl --fail --silent --show-error --max-time 120 --retry 2 https://ensename-api.onrender.com/readyz
